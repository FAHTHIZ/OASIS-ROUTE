<text x="624" y="516" font-size="38" fill="#62A9FF">415</text><text x="624" y="546" font-size="15" font-weight="600" fill="#93A8C0">tests · SQLite + Postgres</text>
</g>
<text x="80" y="600" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#6F86A0">every listed free tier, one account each · * after OpenRouter's 10-credit unlock</text>
