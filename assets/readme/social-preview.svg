<text x="80" y="250" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#g)" letter-spacing="-.02em">Every free token you are</text>
<text x="80" y="320" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#g)" letter-spacing="-.02em">entitled to. One key.</text>
<text x="80" y="380" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#A9BBD0">Open-source LLM gateway: verified free tiers, quota-aware routing,</text>
<text x="80" y="414" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#A9BBD0">honest failover. OpenAI and Anthropic compatible.</text>
<g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800">
