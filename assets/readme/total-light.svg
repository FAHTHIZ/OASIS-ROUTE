<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="tt td">
<title id="tt">Total free LLM capacity per month: about 1.7B tokens</title>
<desc id="td">Every free tier listed by OASIS Route, FreeLLMAPI and OmniRoute, one account per provider, shared pools counted once, checked 2026-11-23. 1.7B tokens a month for 20,000-token agent requests, 626M for 1,500-token chat requests. Verified official limits alone: 71M. With OpenRouter's one-time unlock: 2.3B. Theoretical ceiling: 52.5B. FreeLLMAPI claims 10.1B, OmniRoute 1.6B.</desc>
<defs>
<linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#0E9E85"/><stop offset=".55" stop-color="#2F6FD6"/><stop offset="1" stop-color="#6D4FD8"/></linearGradient>
<radialGradient id="th" cx=".2" cy=".35" r=".6"><stop offset="0" stop-color="#6D4FD8" stop-opacity=".16"/><stop offset="1" stop-color="#6D4FD8" stop-opacity="0"/></radialGradient>
</defs>
<style>@media (prefers-reduced-motion: no-preference) {
.b0{transform-box:fill-box;transform-origin:left;animation:grow 1.3s 0.30s cubic-bezier(.2,.7,.1,1) both}.b1{transform-box:fill-box;transform-origin:left;animation:grow 1.3s 0.48s cubic-bezier(.2,.7,.1,1) both}.b2{transform-box:fill-box;transform-origin:left;animation:grow 1.3s 0.66s cubic-bezier(.2,.7,.1,1) both}.b3{transform-box:fill-box;transform-origin:left;animation:grow 1.3s 0.84s cubic-bezier(.2,.7,.1,1) both}.b4{transform-box:fill-box;transform-origin:left;animation:grow 1.3s 1.02s cubic-bezier(.2,.7,.1,1) both}
.big{animation:rise 1s .1s cubic-bezier(.2,.7,.1,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
}</style>
<rect x=".5" y=".5" width="1279" height="519" rx="26" fill="#F5F8FC" stroke="#D5E1EE"/>
<rect x=".5" y=".5" width="1279" height="519" rx="26" fill="url(#th)"/>
<text x="48" y="64" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#0E9E85" letter-spacing=".16em">TOTAL FREE LLM CAPACITY · PER MONTH</text>
<g class="big">
<text x="44" y="190" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="124" font-weight="800" fill="url(#tg)" letter-spacing="-.04em">~1.7B</text>
<text x="52" y="236" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0F1B2A">free tokens every month</text>
</g>
<text x="52" y="276" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#55697F">Every free tier anyone lists, signed up once each.</text>
<text x="52" y="298" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#55697F">Shared pools counted once · coding-agent requests</text>
<text x="52" y="320" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#55697F">(626M at chat size) · 29 providers · recurring only</text>
<line x1="52" y1="356" x2="560" y2="356" stroke="#D5E1EE"/>
<text x="52" y="388" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#55697F" letter-spacing=".14em">WHAT OTHERS ADVERTISE</text>
<text x="52" y="420" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F1B2A">FreeLLMAPI <tspan fill="#B7791F">10.1B</tspan><tspan font-weight="400" fill="#55697F">  adds shared pools once per model</tspan></text>
<text x="52" y="446" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F1B2A">OmniRoute <tspan fill="#B7791F">1.6B</tspan><tspan font-weight="400" fill="#55697F">  ~1B is Mistral, which has no free API</tspan></text>
<text x="52" y="488" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" fill="#55697F">checked 2026-11-23 · python scripts/ecosystem_capacity.py</text>
<text x="632" y="76" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#55697F" letter-spacing=".14em">HOW THE TOTAL BUILDS UP</text>
<text x="1232" y="76" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#55697F">log scale · tokens/month</text>
