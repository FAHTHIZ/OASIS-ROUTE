</g><g class="t1">

<circle cx="632" cy="193" r="5" fill="#2F6FD6"/>
<text x="648" y="198" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#0F1B2A">Every first-party free tier</text>
<text x="648" y="218" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#55697F">labs and inference clouds</text>
<rect x="920" y="186" width="220" height="12" rx="6" fill="#E3EBF4"/>
<rect class="b1" x="920" y="186" width="89.2" height="12" rx="6" fill="#2F6FD6"/>
<text x="1232" y="197" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#2F6FD6">418M</text>
</g><g class="t2">
<rect x="610" y="238" width="636" height="60" rx="14" fill="#6D4FD8" fill-opacity=".10" stroke="#6D4FD8" stroke-opacity=".55"/>
<circle cx="632" cy="259" r="5" fill="#6D4FD8"/>
<text x="648" y="264" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#0F1B2A">Everything listed</text>
<text x="648" y="284" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#55697F">first-party + gateways, one account each</text>
