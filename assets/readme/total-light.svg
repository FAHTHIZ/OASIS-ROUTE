</g>
<text x="632" y="474" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#55697F">Mistral is excluded as disputed; 15 tiers with no published cap are not counted.</text>
<text x="632" y="494" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#55697F">Credits at $1 per million tokens. Every number is reproducible from the script.</text>
