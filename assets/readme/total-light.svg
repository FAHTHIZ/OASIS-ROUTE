<rect class="b2" x="920" y="252" width="122.4" height="12" rx="6" fill="#6D4FD8"/>
<text x="1232" y="263" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#6D4FD8">1.7B</text>
</g><g class="t3">

<circle cx="632" cy="325" r="5" fill="#B7791F"/>
<text x="648" y="330" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#0F1B2A">+ OpenRouter unlock</text>
<text x="648" y="350" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#55697F">one-time 10 credits: 1,000 free requests/day</text>
<rect x="920" y="318" width="220" height="12" rx="6" fill="#E3EBF4"/>
<rect class="b3" x="920" y="318" width="129.4" height="12" rx="6" fill="#B7791F"/>
<text x="1232" y="329" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#B7791F">2.3B</text>
</g><g class="t4">

<circle cx="632" cy="391" r="5" fill="#55697F"/>
<text x="648" y="396" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#0F1B2A">Theoretical ceiling</text>
<text x="648" y="416" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#55697F">rate-limit-only tiers run 24/7</text>
<rect x="920" y="384" width="220" height="12" rx="6" fill="#E3EBF4"/>
<rect class="b4" x="920" y="384" width="204.6" height="12" rx="6" fill="#55697F"/>
