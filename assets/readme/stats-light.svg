<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="152" viewBox="0 0 1280 152" role="img" aria-labelledby="t d">
<title id="t">OASIS Route in numbers</title>
<desc id="d">~32M free tokens a month (chat use, no purchase); ~71M for coding agents (20K-token requests, no purchase); ~650M agent tokens a month (after a one-time 10-credit unlock); 409 tests (SQLite and PostgreSQL in CI)</desc>
