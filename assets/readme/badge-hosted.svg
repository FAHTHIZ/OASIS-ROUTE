<svg xmlns="http://www.w3.org/2000/svg" width="234" height="30" viewBox="0 0 234 30" role="img" aria-label="self-hosted: your machine">
<title>self-hosted: your machine</title>
<defs>
<linearGradient id="hosted-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131D2E"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
<linearGradient id="hosted-val" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35DFC1"/><stop offset="1" stop-color="#62A9FF"/></linearGradient>
<linearGradient id="hosted-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35DFC1" stop-opacity=".6"/><stop offset=".5" stop-color="#35DFC1" stop-opacity=".15"/><stop offset="1" stop-color="#62A9FF" stop-opacity=".55"/></linearGradient>
<linearGradient id="hosted-shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="hosted-clip"><rect width="234" height="30" rx="15"/></clipPath>
</defs>
<style>@media (prefers-reduced-motion: no-preference) {
.sw{animation:sw 9s 2s cubic-bezier(.4,0,.2,1) infinite}
@keyframes sw{0%{transform:translateX(-80px)}20%,100%{transform:translateX(314px)}}
}</style>
<g clip-path="url(#hosted-clip)">
<rect width="234" height="30" fill="url(#hosted-bg)"/>
<rect x="124.2" y="3" width="106.8" height="24" rx="12" fill="url(#hosted-val)"/>
<rect class="sw" x="-60" y="0" width="46" height="30" fill="url(#hosted-shine)" transform="translate(-80 0)"/>
</g>
<rect x=".5" y=".5" width="233" height="29" rx="14.5" fill="none" stroke="url(#hosted-edge)"/>
<g transform="translate(12 6) scale(.75)" fill="none" stroke="#35DFC1" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></g>
<text x="38" y="18.8" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#A6B8CC" letter-spacing=".04em">SELF-HOSTED</text>
<text x="177.6" y="19.4" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1220">your machine</text>
</svg>
