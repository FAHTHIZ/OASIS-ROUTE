[project]
name = "oasis-route"
version = "0.2.0"
description = "First-party, open-source inference-routing companion for OASIS; a standalone LLM gateway with verified free tiers, quota-aware routing, and honest failover."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Fahim Hussain" }]
keywords = [
  "llm", "llm-gateway", "llm-router", "ai-gateway", "openai-compatible", "anthropic", "free-tier",
  "inference", "rate-limiting", "failover", "fastapi", "self-hosted", "claude-code",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "cryptography>=43",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.25",
]

[project.urls]
Homepage = "https://github.com/FAHTHIZ/OASIS-ROUTE"
Documentation = "https://github.com/FAHTHIZ/OASIS-ROUTE/tree/main/docs"
Changelog = "https://github.com/FAHTHIZ/OASIS-ROUTE/blob/main/CHANGELOG.md"
Issues = "https://github.com/FAHTHIZ/OASIS-ROUTE/issues"

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]

[project.scripts]
oasis-route = "oasis_route.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "opentelemetry-sdk>=1.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oasis_route"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101", "B008", "RUF012", "S311", "PT018"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108", "B017", "PT011"]
"src/oasis_route/db/migrations/**" = ["E501"]
"scripts/readme_assets.py" = ["E501"]  # SVG markup templates
"scripts/test_commit_attribution.py" = ["PT009", "PT027"]  # stdlib unittest, runs without pytest
"scripts/install-git-hooks.py" = ["S607"]  # invokes `git` from PATH by design

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["oasis_route"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["alembic.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
