name: Feature idea
description: Suggest an improvement to routing, discovery, the console or the API
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: rules
    attributes:
      label: Ground rules
      options:
        - label: This does not create provider accounts, harvest credentials, rotate accounts or evade quotas.
          required: true
