name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest --cov=oasis_route --cov-report=term-missing

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oasis
          POSTGRES_PASSWORD: oasis
          POSTGRES_DB: oasis_route_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oasis" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OASIS_TEST_DATABASE_URL: postgresql+asyncpg://oasis:oasis@localhost:5432/oasis_route_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Dependency vulnerability audit
        run: |
          uv export --frozen --no-dev --all-extras --no-emit-project --format requirements-txt -o requirements.txt
          uvx pip-audit -r requirements.txt --disable-pip --progress-spinner off
      - name: License compatibility
        run: |
          UV_PROJECT_ENVIRONMENT=.runtime uv sync --frozen --no-dev --all-extras
          .runtime/bin/python scripts/check_licenses.py
      - name: Secret scan (full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --no-banner --redact --config /repo/.gitleaks.toml /repo
      - name: SBOM (CycloneDX)
        run: uvx --from cyclonedx-bom cyclonedx-py environment .runtime --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  install-and-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oasis
          POSTGRES_PASSWORD: oasis
          POSTGRES_DB: oasis_route_install
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oasis" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install from the built wheel with pip (production mode, PostgreSQL)
        env:
          OASIS_INSTALL_DATABASE_URL: postgresql+asyncpg://oasis:oasis@localhost:5432/oasis_route_install
        run: scripts/install_check.sh
      - name: Upgrade from the previous release with live data
        run: scripts/upgrade_check.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t oasis-route:ci .
      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: oasis-route:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Validate compose file
        run: |
          printf 'POSTGRES_PASSWORD=ci\nOASIS_ROUTE_MASTER_KEY=%s\nOASIS_ROUTE_API_KEY_PEPPER=%s\n' \
            "$(python3 -c 'import os,base64;print(base64.b64encode(os.urandom(32)).decode())')" \
            "$(python3 -c 'import secrets;print(secrets.token_urlsafe(32))')" > .env
          docker compose config -q
      - name: Smoke test the default deployment
        run: |
          docker compose up -d --build api
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/readyz; then break; fi; sleep 2
          done
          curl -fsS http://127.0.0.1:8080/readyz | tee /tmp/ready.json
          grep -q '"status":"ready"' /tmp/ready.json
          sleep 20
          curl -fsS http://127.0.0.1:8080/readyz | grep -q '"worker":"running"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
