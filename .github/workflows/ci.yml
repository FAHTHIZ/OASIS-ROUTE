name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest --cov=oasis_route --cov-report=term-missing

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oasis
          POSTGRES_PASSWORD: oasis
          POSTGRES_DB: oasis_route_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oasis" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OASIS_TEST_DATABASE_URL: postgresql+asyncpg://oasis:oasis@localhost:5432/oasis_route_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t oasis-route:ci .
      - name: Validate compose file
        run: |
          printf 'POSTGRES_PASSWORD=ci\nOASIS_ROUTE_MASTER_KEY=%s\nOASIS_ROUTE_API_KEY_PEPPER=%s\n' \
            "$(python3 -c 'import os,base64;print(base64.b64encode(os.urandom(32)).decode())')" \
            "$(python3 -c 'import secrets;print(secrets.token_urlsafe(32))')" > .env
          docker compose config -q
      - name: Smoke test the default deployment
        run: |
          docker compose up -d --build api
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/readyz; then break; fi; sleep 2
          done
          curl -fsS http://127.0.0.1:8080/readyz | tee /tmp/ready.json
          grep -q '"status":"ready"' /tmp/ready.json
          sleep 20
          curl -fsS http://127.0.0.1:8080/readyz | grep -q '"worker":"running"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
