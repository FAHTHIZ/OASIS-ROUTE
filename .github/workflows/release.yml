name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub release
      packages: write        # push the image to GHCR
      id-token: write        # sign provenance attestations (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Check version matches tag
        run: |
          v=$(uv run --frozen python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "pyproject version $v does not match tag $GITHUB_REF_NAME"; exit 1; }
      - name: Test
        run: uv sync --locked && uv run pytest -q
      - name: Build distributions
        run: uv build
      - name: SBOM
        run: |
          UV_PROJECT_ENVIRONMENT=.runtime uv sync --frozen --no-dev --all-extras
          uvx --from cyclonedx-bom cyclonedx-py environment .runtime --output-format JSON --output-file dist/oasis-route.cdx.json
      - name: Build provenance for distributions
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/oasis-route:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/oasis-route:latest
      - name: Build provenance for the image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/oasis-route
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk "/^## \\[${GITHUB_REF_NAME#v}\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
